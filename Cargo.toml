[package]
name = "st"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
cpal = "0.18.1"
ctrlc = "3.5.2"
eframe = { version = "0.35.0", features = ["persistence"] }
env_logger = "0.11.11"
log = "0.4.33"
ringbuf = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1.31"
