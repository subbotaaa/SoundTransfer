# SoundTransfer — переключатель для Home Assistant (современный формат template).
#
# Замените IP на свои:
#   WIN_IP — Windows ПК (отправитель), MAC_IP — Mac (приёмник).
# Порт управления по умолчанию 48101. Приложение SoundTransfer должно быть
# запущено на обеих машинах (автозапуск при входе) — переключатель
# включает/выключает передачу.

rest_command:
  soundtransfer_win_start:
    url: "http://WIN_IP:48101/start"
    method: post
  soundtransfer_win_stop:
    url: "http://WIN_IP:48101/stop"
    method: post
  soundtransfer_mac_start:
    url: "http://MAC_IP:48101/start"
    method: post
  soundtransfer_mac_stop:
    url: "http://MAC_IP:48101/stop"
    method: post

rest:
  - resource: "http://WIN_IP:48101/status"
    scan_interval: 10
    binary_sensor:
      - name: soundtransfer_active
        unique_id: soundtransfer_active
        value_template: "{{ value_json.running }}"

template:
  - switch:
      - name: "Звук ПК → Mac"
        unique_id: soundtransfer
        state: "{{ is_state('binary_sensor.soundtransfer_active', 'on') }}"
        turn_on:
          # Сначала приём на Mac, затем отправка с ПК
          - action: rest_command.soundtransfer_mac_start
          - delay:
              seconds: 2
          - action: rest_command.soundtransfer_win_start
        turn_off:
          - action: rest_command.soundtransfer_win_stop
          - action: rest_command.soundtransfer_mac_stop
