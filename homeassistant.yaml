# SoundTransfer — переключатель для Home Assistant (современный формат template).
#
# Замените IP на свои:
#   SENDER_IP — устройство-отправитель, RECEIVER_IP — устройство-приёмник.
# Направление любое: Windows → Mac, Mac → Windows, две винды, два мака.
# Порт управления по умолчанию 48101. Приложение SoundTransfer должно быть
# запущено на обеих машинах (автозапуск при входе) — переключатель
# включает/выключает передачу.

rest_command:
  soundtransfer_sender_start:
    url: "http://SENDER_IP:48101/start"
    method: post
  soundtransfer_sender_stop:
    url: "http://SENDER_IP:48101/stop"
    method: post
  soundtransfer_receiver_start:
    url: "http://RECEIVER_IP:48101/start"
    method: post
  soundtransfer_receiver_stop:
    url: "http://RECEIVER_IP:48101/stop"
    method: post

# /status отдаёт два разных факта:
#   running — поток запущен (кнопка нажата);
#   linked  — звук реально доходит до приёмника (подтверждения с той стороны).
#             null, если вторая сторона старее 0.2.4 и подтверждений не шлёт.
# Индикацию стоит вешать на linked: «запущено, но не доходит» — это как раз
# тот случай, когда раньше приходилось перезапускать руками.
rest:
  - resource: "http://SENDER_IP:48101/status"
    scan_interval: 10
    binary_sensor:
      - name: soundtransfer_active
        unique_id: soundtransfer_active
        value_template: "{{ value_json.running }}"
      - name: soundtransfer_linked
        unique_id: soundtransfer_linked
        value_template: "{{ value_json.linked }}"
        availability: "{{ value_json.linked is not none }}"

template:
  - switch:
      - name: "SoundTransfer"
        unique_id: soundtransfer
        state: "{{ is_state('binary_sensor.soundtransfer_active', 'on') }}"
        turn_on:
          # Сначала приём, затем отправка
          - action: rest_command.soundtransfer_receiver_start
          - delay:
              seconds: 2
          - action: rest_command.soundtransfer_sender_start
        turn_off:
          - action: rest_command.soundtransfer_sender_stop
          - action: rest_command.soundtransfer_receiver_stop

# Страховка: передача запущена, но звук не доходит дольше минуты —
# перезапускаем приёмник (именно он обычно и «залипает»).
automation:
  - alias: "SoundTransfer: автоперезапуск, если звук не доходит"
    id: soundtransfer_selfheal
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.soundtransfer_linked
        to: "off"
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.soundtransfer_active
        state: "on"
    actions:
      - action: rest_command.soundtransfer_receiver_stop
      - delay:
          seconds: 2
      - action: rest_command.soundtransfer_receiver_start
